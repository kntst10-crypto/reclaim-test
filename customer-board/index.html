<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>顧客管理(同期版)</title>
<style>
  * { box-sizing: border-box; }
  html { touch-action: manipulation; -webkit-tap-highlight-color: transparent; }
  body { margin: 0; font-family: -apple-system, "Hiragino Kaku Gothic ProN", "Noto Sans JP", sans-serif; background: #fbfbf9; color: #17233c; font-size: 17px; }
  header { position: sticky; top: 0; z-index: 5; background: #fbfbf9; padding: 16px 18px 12px; border-bottom: 2px solid #1f2a44; }
  header h1 { margin: 0; font-size: 21px; font-weight: 700; letter-spacing: .12em; color: #1f2a44; display: inline-block; }
  header .sum { float: right; font-size: 13px; color: #5a6577; text-align: right; line-height: 1.6; }
  header p { margin: 6px 0 0; font-size: 12px; color: #8a93a3; clear: both; letter-spacing: .04em; }
  main { padding: 16px 14px 118px; max-width: 720px; margin: 0 auto; }
  .row { display: flex; gap: 8px; margin-bottom: 12px; }
  .row > * { flex: 1; }
  input, select, textarea { width: 100%; font-size: 16px; padding: 14px; border: 1px solid #d4d8de; border-radius: 6px; background: #fff; color: #17233c; }
  input:focus, select:focus, textarea:focus { outline: 2px solid #1f2a44; outline-offset: -1px; border-color: #1f2a44; }
  button { font-size: 15px; min-height: 48px; padding: 12px 16px; border-radius: 6px; border: 1px solid #1f2a44; background: #1f2a44; color: #fff; letter-spacing: .06em; }
  button.ghost { background: #fff; color: #1f2a44; }
  button.danger { background: #fff; color: #b3261e; border-color: #b3261e; }
  .chips { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 16px; }
  .chip { padding: 11px 16px; min-height: 44px; border-radius: 999px; border: 1px solid #c3c9d2; background: #fff; font-size: 15px; color: #3c465a; }
  .chip.on { background: #1f2a44; color: #fff; border-color: #1f2a44; }
  .chip .n { opacity: .6; font-size: 12px; margin-left: 5px; }
  .card { background: #fff; border: none; border-top: 1px solid #e3e6ea; border-left: 3px solid #d4d8de; border-radius: 0; padding: 16px 16px 14px; margin-bottom: 0; cursor: pointer; }
  .card:last-of-type { border-bottom: 1px solid #e3e6ea; }
  .card.overdue { border-left-color: #b3261e; }
  .card.today { border-left-color: #e08a00; }
  .card.soon { border-left-color: #d9b800; }
  .card h2 { margin: 0 0 6px; font-size: 19px; font-weight: 700; color: #17233c; }
  .card .meta { font-size: 15px; color: #4a5468; line-height: 1.8; }
  .badge { display: inline-block; font-size: 13px; padding: 3px 10px; border-radius: 999px; border: 1px solid #1f2a44; background: #fff; color: #1f2a44; margin-left: 8px; vertical-align: 2px; }
  .badge.done { border-color: #1d5c2e; color: #1d5c2e; }
  .badge.off { border-color: #b3261e; color: #b3261e; }
  .nbadge { display: inline-block; font-size: 13px; padding: 3px 10px; border-radius: 999px; margin-left: 6px; vertical-align: 2px; background: #f0f1f3; color: #5a6577; }
  .nbadge.overdue { background: #f8d7d4; color: #8c1d18; font-weight: 700; }
  .nbadge.today { background: #ffe3b3; color: #7a4d00; font-weight: 700; }
  .nbadge.soon { background: #fff3b0; color: #6b5900; }
  .card .actions { margin-top: 12px; display: flex; gap: 8px; align-items: center; }
  .card .actions button { min-height: 48px; padding: 10px 18px; font-size: 15px; }
  .card .actions select { width: auto; flex: 0 0 auto; font-size: 15px; padding: 12px; min-height: 48px; }
  #form { background: #fff; border: 1px solid #1f2a44; border-radius: 8px; padding: 16px; margin-bottom: 16px; display: none; }
  #form label { display: block; font-size: 14px; color: #5a6577; margin: 12px 0 5px; letter-spacing: .05em; }
  .note { font-size: 12px; color: #8a93a3; line-height: 1.7; margin-top: 20px; }
  .empty { text-align: center; color: #8a93a3; padding: 36px 0; font-size: 15px; }
  footer { position: fixed; bottom: 0; left: 0; right: 0; background: rgba(251,251,249,.96); border-top: 1px solid #d4d8de; padding: 12px 12px calc(12px + env(safe-area-inset-bottom)); display: flex; gap: 10px; justify-content: center; }
  footer button { flex: 1; min-height: 54px; font-size: 16px; }
</style>
<style>
  #gate { max-width: 420px; margin: 60px auto; padding: 0 20px; text-align: center; }
  #gate h1 { font-size: 21px; letter-spacing: .12em; color: #1f2a44; }
  #gate p { font-size: 14px; color: #5a6577; line-height: 1.8; }
  #gate button { width: 100%; margin-top: 16px; }
  #app { display: none; }
  header .who { float: right; font-size: 12px; color: #8a93a3; text-align: right; line-height: 1.6; }
  header .who button { min-height: 0; padding: 4px 10px; font-size: 12px; margin-left: 6px; }
  #accessBox { background: #fff; border: 1px solid #1f2a44; border-radius: 8px; padding: 16px; margin-bottom: 16px; display: none; }
  #accessBox label { display: block; font-size: 14px; color: #5a6577; margin: 12px 0 5px; }
  .sync { font-size: 12px; color: #8a93a3; margin-left: 8px; }
</style>
</head>
<body>
<div id="gate">
  <h1>顧客管理</h1>
  <p>許可されたGoogleアカウントでログインしてください。<br>データは全員の画面にその場で同期されます。</p>
  <button id="login">Googleでログイン</button>
  <p id="gateMsg"></p>
</div>
<div id="app">
<header>
  <h1>顧客管理</h1>
  <div class="who"><span id="who"></span><button class="ghost" id="logout">ログアウト</button><div class="sync" id="syncState">接続中…</div></div>
  <p>全員の変更がその場で反映されます。</p>
</header>
<main>
  <div class="row">
    <input id="q" type="search" placeholder="氏名・物件・メモで検索" autocomplete="off">
  </div>
  <div class="row">
    <select id="sort">
      <option value="next">並び替え: 次のアクションが近い順</option>
      <option value="updated">並び替え: 更新が新しい順</option>
      <option value="amount">並び替え: 金額が大きい順</option>
      <option value="name">並び替え: 氏名順</option>
    </select>
  </div>
  <div class="chips" id="chips"></div>
  <div id="form">
    <input type="hidden" id="f-id">
    <label>氏名</label><input id="f-name" autocomplete="off">
    <label>連絡先(LINE・電話など)</label><input id="f-contact" autocomplete="off">
    <label>物件</label><input id="f-property" autocomplete="off">
    <label>金額(円)</label><input id="f-amount" inputmode="numeric" autocomplete="off">
    <label>ステータス</label>
    <select id="f-status"></select>
    <label>次のアクション日</label><input id="f-next" type="date">
    <label>メモ</label><textarea id="f-memo" rows="3"></textarea>
    <div class="row" style="margin-top:14px">
      <button id="save">保存</button>
      <button class="ghost" id="cancel">閉じる</button>
      <button class="danger" id="remove" style="margin-left:auto">削除</button>
    </div>
  </div>
  <div id="accessBox">
    <label>共有メンバー(Googleアカウントのメール、1行に1つ)</label>
    <textarea id="accessEmails" rows="4"></textarea>
    <div class="row" style="margin-top:12px">
      <button id="accessSave">保存</button>
      <button class="ghost" id="accessCancel">閉じる</button>
    </div>
    <p class="note">ここに入れた人だけが、このボードを見たり編集したりできます。</p>
  </div>
  <div id="list"></div>
  <p class="note">書き出し: 全件をJSONファイルで保存します(バックアップ用)。読み込み: JSONを選ぶと、同じ顧客は上書き・新しい顧客は追加されます。</p>
</main>
<footer>
  <button id="add">顧客を追加</button>
  <button class="ghost" id="export">書き出し</button>
  <button class="ghost" id="importBtn">読み込み</button>
  <button class="ghost" id="accessBtn" style="display:none">共有設定</button>
  <input type="file" id="importFile" accept=".json,application/json" hidden>
</footer>
</div>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-app.js";
import { getAuth, GoogleAuthProvider, signInWithPopup, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-auth.js";
import { getFirestore, collection, doc, setDoc, deleteDoc, onSnapshot, getDoc } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore.js";

var firebaseConfig = {
  "apiKey": "AIzaSyDOFh17do2CfvAvJg8Os-xoX34YMr7YCXI",
  "authDomain": "brage-customer-board.firebaseapp.com",
  "projectId": "brage-customer-board",
  "storageBucket": "brage-customer-board.firebasestorage.app",
  "messagingSenderId": "947820794383",
  "appId": "1:947820794383:web:ef166437e27e737fe5897a"
};
var OWNER_EMAIL = "neocity.kuro@gmail.com";
var STATUSES = ["検討中", "申込済", "審査中", "契約済", "決済済", "見送り"];
var filter = "すべて", q = "", sortMode = "next";
var customers = [], me = null, accessEmails = [];

var app = initializeApp(firebaseConfig);
var auth = getAuth(app);
var db = getFirestore(app);

function esc(s) { return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; }); }
function amtNum(v) { var n = Number(String(v == null ? "" : v).replace(/[^0-9]/g, "")); return isNaN(n) ? 0 : n; }
function fmtAmount(v) { if (v === "" || v == null) return ""; var n = amtNum(v); return n ? n.toLocaleString("ja-JP") + "円" : String(v); }
function badgeClass(s) { return s === "決済済" || s === "契約済" ? "badge done" : (s === "見送り" ? "badge off" : "badge"); }
function todayStr() { var d = new Date(); return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0"); }
function dayDiff(ds) { if (!ds) return null; var a = new Date(todayStr() + "T00:00:00"), b = new Date(ds + "T00:00:00"); return Math.round((b - a) / 86400000); }
function nextInfo(c) {
  var d = dayDiff(c.next);
  if (d === null || c.status === "決済済" || c.status === "見送り") return null;
  if (d < 0) return { cls: "overdue", label: Math.abs(d) + "日超過" };
  if (d === 0) return { cls: "today", label: "今日" };
  if (d <= 7) return { cls: "soon", label: "あと" + d + "日" };
  return { cls: "", label: c.next };
}

function renderChips() {
  var box = document.getElementById("chips");
  box.innerHTML = "";
  ["すべて"].concat(STATUSES).forEach(function (s) {
    var n = s === "すべて" ? customers.length : customers.filter(function (c) { return c.status === s; }).length;
    var b = document.createElement("button");
    b.className = "chip" + (filter === s ? " on" : "");
    b.innerHTML = esc(s) + '<span class="n">' + n + "</span>";
    b.onclick = function () { filter = s; render(); };
    box.appendChild(b);
  });
}

function render() {
  renderChips();
  var box = document.getElementById("list");
  var ql = q.trim().toLowerCase();
  var rows = customers.filter(function (c) {
    if (filter !== "すべて" && c.status !== filter) return false;
    if (!ql) return true;
    return [c.name, c.property, c.memo, c.contact].join(" ").toLowerCase().indexOf(ql) !== -1;
  });
  rows.sort(function (a, b) {
    if (sortMode === "amount") return amtNum(b.amount) - amtNum(a.amount);
    if (sortMode === "name") return String(a.name).localeCompare(String(b.name), "ja");
    if (sortMode === "updated") return (b.updatedAt || "") < (a.updatedAt || "") ? -1 : 1;
    var ad = (a.status === "決済済" || a.status === "見送り") ? "9998" : (a.next || "9999");
    var bd = (b.status === "決済済" || b.status === "見送り") ? "9998" : (b.next || "9999");
    return ad < bd ? -1 : ad > bd ? 1 : 0;
  });
  var total = rows.reduce(function (s, c) { return s + amtNum(c.amount); }, 0);
  document.getElementById("syncState").textContent = "同期中 / " + rows.length + "件" + (total ? " / " + total.toLocaleString("ja-JP") + "円" : "");
  if (!rows.length) {
    box.innerHTML = '<p class="empty">' + (customers.length ? "条件に合う顧客がいません。" : "まだ顧客がいません。「顧客を追加」から登録できます。") + "</p>";
    return;
  }
  box.innerHTML = "";
  rows.forEach(function (c) {
    var ni = nextInfo(c);
    var d = document.createElement("div");
    d.className = "card" + (ni ? " " + ni.cls : "");
    var selOpts = STATUSES.map(function (s) { return '<option value="' + s + '"' + (s === c.status ? " selected" : "") + ">" + s + "</option>"; }).join("");
    d.innerHTML =
      "<h2>" + esc(c.name || "(無題)") + '<span class="' + badgeClass(c.status) + '">' + esc(c.status || "") + "</span>" +
      (ni ? '<span class="nbadge ' + ni.cls + '">' + esc(ni.label) + "</span>" : "") + "</h2>" +
      '<div class="meta">' +
      (c.property ? "物件: " + esc(c.property) + "<br>" : "") +
      (c.amount ? "金額: " + esc(fmtAmount(c.amount)) + "<br>" : "") +
      (c.contact ? "連絡先: " + esc(c.contact) + "<br>" : "") +
      (c.next ? "次のアクション: " + esc(c.next) + "<br>" : "") +
      (c.memo ? esc(c.memo) : "") +
      "</div>" +
      '<div class="actions"><select data-status>' + selOpts + '</select><button class="ghost" data-edit>編集</button></div>';
    d.querySelector("[data-edit]").onclick = function () { openForm(c); };
    d.onclick = function (e) { if (!e.target.closest("button, select, a, input, textarea")) openForm(c); };
    d.querySelector("[data-status]").onchange = function (e) {
      setDoc(doc(db, "customers", c.id), Object.assign({}, c, { status: e.target.value, updatedAt: new Date().toISOString() }));
    };
    box.appendChild(d);
  });
}

var form = document.getElementById("form");
var statusSel = document.getElementById("f-status");
STATUSES.forEach(function (s) { var o = document.createElement("option"); o.value = s; o.textContent = s; statusSel.appendChild(o); });

function openForm(c) {
  document.getElementById("f-id").value = c ? c.id : "";
  document.getElementById("f-name").value = c ? c.name || "" : "";
  document.getElementById("f-contact").value = c ? c.contact || "" : "";
  document.getElementById("f-property").value = c ? c.property || "" : "";
  document.getElementById("f-amount").value = c ? c.amount || "" : "";
  document.getElementById("f-status").value = c ? c.status || "検討中" : "検討中";
  document.getElementById("f-next").value = c ? c.next || "" : "";
  document.getElementById("f-memo").value = c ? c.memo || "" : "";
  document.getElementById("remove").style.display = c ? "" : "none";
  form.style.display = "block";
  form.scrollIntoView({ behavior: "smooth", block: "start" });
}
function closeForm() { form.style.display = "none"; }

document.getElementById("add").onclick = function () { openForm(null); };
document.getElementById("cancel").onclick = closeForm;
document.getElementById("save").onclick = function () {
  var name = document.getElementById("f-name").value.trim();
  if (!name) { alert("氏名を入れてください。"); return; }
  var id = document.getElementById("f-id").value || ("c" + Date.now().toString(36) + Math.random().toString(36).slice(2, 7));
  var rec = {
    id: id, name: name,
    contact: document.getElementById("f-contact").value.trim(),
    property: document.getElementById("f-property").value.trim(),
    amount: document.getElementById("f-amount").value.trim(),
    status: document.getElementById("f-status").value,
    next: document.getElementById("f-next").value,
    memo: document.getElementById("f-memo").value.trim(),
    updatedAt: new Date().toISOString()
  };
  setDoc(doc(db, "customers", id), rec);
  closeForm();
};
document.getElementById("remove").onclick = function () {
  var id = document.getElementById("f-id").value;
  if (!id) return;
  if (!confirm("この顧客を削除しますか?")) return;
  deleteDoc(doc(db, "customers", id));
  closeForm();
};
document.getElementById("q").addEventListener("input", function (e) { q = e.target.value; render(); });
document.getElementById("sort").addEventListener("change", function (e) { sortMode = e.target.value; render(); });

document.getElementById("export").onclick = function () {
  var blob = new Blob([JSON.stringify(customers, null, 2)], { type: "application/json" });
  var file = new File([blob], "customers-" + new Date().toISOString().slice(0, 10) + ".json", { type: "application/json" });
  if (navigator.share && navigator.canShare && navigator.canShare({ files: [file] })) { navigator.share({ files: [file], title: "顧客管理データ" }).catch(function () {}); return; }
  var a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = file.name;
  a.click();
  setTimeout(function () { URL.revokeObjectURL(a.href); }, 5000);
};
document.getElementById("importBtn").onclick = function () { document.getElementById("importFile").click(); };
document.getElementById("importFile").addEventListener("change", function (e) {
  var f = e.target.files[0];
  if (!f) return;
  var r = new FileReader();
  r.onload = function () {
    try {
      var incoming = JSON.parse(r.result);
      if (!Array.isArray(incoming)) throw new Error("not array");
      var n = 0;
      incoming.forEach(function (c) { if (c && c.id && c.name) { setDoc(doc(db, "customers", c.id), c); n++; } });
      alert("読み込みました: " + n + "件");
    } catch (err) { alert("読み込めませんでした。JSONファイルか確認してください。"); }
    e.target.value = "";
  };
  r.readAsText(f);
});

var accessBox = document.getElementById("accessBox");
document.getElementById("accessBtn").onclick = function () {
  document.getElementById("accessEmails").value = accessEmails.join("
");
  accessBox.style.display = "block";
  accessBox.scrollIntoView({ behavior: "smooth", block: "start" });
};
document.getElementById("accessCancel").onclick = function () { accessBox.style.display = "none"; };
document.getElementById("accessSave").onclick = function () {
  var emails = document.getElementById("accessEmails").value.split(/
/).map(function (s) { return s.trim(); }).filter(Boolean);
  setDoc(doc(db, "config", "access"), { emails: emails }).then(function () { accessEmails = emails; accessBox.style.display = "none"; alert("保存しました。"); });
};

document.getElementById("login").onclick = function () {
  signInWithPopup(auth, new GoogleAuthProvider()).catch(function (e) { document.getElementById("gateMsg").textContent = "ログインできませんでした: " + e.message; });
};
document.getElementById("logout").onclick = function () { signOut(auth); };

onAuthStateChanged(auth, function (user) {
  me = user;
  if (!user) {
    document.getElementById("gate").style.display = "block";
    document.getElementById("app").style.display = "none";
    return;
  }
  document.getElementById("who").textContent = user.email;
  var isOwner = user.email === OWNER_EMAIL;
  getDoc(doc(db, "config", "access")).then(function (snap) {
    accessEmails = snap.exists() ? (snap.data().emails || []) : [];
    var allowed = isOwner || accessEmails.indexOf(user.email) !== -1;
    if (!allowed) {
      document.getElementById("gateMsg").textContent = "このアカウント(" + user.email + ")は許可されていません。管理者に共有設定への追加を頼んでください。";
      signOut(auth);
      return;
    }
    document.getElementById("gate").style.display = "none";
    document.getElementById("app").style.display = "block";
    document.getElementById("accessBtn").style.display = isOwner ? "" : "none";
    onSnapshot(collection(db, "customers"), function (snap2) {
      customers = [];
      snap2.forEach(function (d) { customers.push(d.data()); });
      render();
    }, function (err) {
      document.getElementById("syncState").textContent = "読み取りできません: " + err.message;
    });
    onSnapshot(doc(db, "config", "access"), function (snap3) {
      if (snap3.exists()) accessEmails = snap3.data().emails || [];
    });
  });
});
</script>
</body>
</html>
